aid: vungle
name: Vungle
description: >-
  Vungle is a mobile app monetization and user-acquisition platform, now operated as
  part of Liftoff (the merged Liftoff + Vungle mobile growth company). Vungle's in-app
  advertising SDKs help mobile publishers monetize with performance-focused ad formats
  (video, interactive, and playable ads), while Liftoff's advertiser APIs let growth
  teams launch and manage user-acquisition campaigns, assemble creatives, ingest
  audiences, and pull automated performance reporting. The programmatic surface is
  documented at docs.liftoff.io and includes a Reporting API, a closed-beta Campaign
  Management API, an Audiences Integration API, a GDPR Opt-Out API, and a
  server-to-server (S2S) postback integration. All advertiser APIs authenticate with
  an HTTP Basic API key and secret issued by a Liftoff Account Manager.
