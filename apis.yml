apis:
- name: Liftoff Reporting API
  description: >-
    Automated access to Vungle/Liftoff campaign performance reports — impressions,
    clicks, installs, and in-app events — with configurable groupings, metrics, and
    cohort (look-back window) analysis. HTTP Basic authenticated; JSON.
  humanURL: https://docs.liftoff.io/advertiser/reporting_api
  baseURL: https://data.liftoff.io/api/v1
  properties:
  - type: Documentation
    url: https://docs.liftoff.io/advertiser/reporting_api
  - type: Authentication
    url: authentication/vungle-authentication.yml
- name: Liftoff Campaign Management API
  description: >-
    Closed-beta API to programmatically launch UA expansion campaigns, manage spend
    and targeting, upload assets, and assemble creatives. Standard REST/JSON at
    https://cm-api.liftoff.io/v1.
  humanURL: https://docs.liftoff.io/advertiser/campaign_management_api
  baseURL: https://cm-api.liftoff.io/v1
  properties:
  - type: Documentation
    url: https://docs.liftoff.io/advertiser/campaign_management_api
- name: Liftoff Audiences Integration API
  description: >-
    Audience ingestion/validation API for partners working on behalf of multiple
    clients, at https://analytics.liftoff.io/audiences/v1.
  humanURL: https://docs.liftoff.io/advertiser/direct/liftoff-api-audiences
  baseURL: https://analytics.liftoff.io/audiences/v1
  properties:
  - type: Documentation
    url: https://docs.liftoff.io/advertiser/direct/liftoff-api-audiences
- name: Liftoff GDPR Opt-Out API
  description: >-
    Submit GDPR-compliant opt-out requests to remove user data by device ID, at
    https://analytics.liftoff.io/opt_out/v3.
  humanURL: https://docs.liftoff.io/advertiser/direct/liftoff-gdpr-opt-out-api
  baseURL: https://analytics.liftoff.io/opt_out/v3
  properties:
  - type: Documentation
    url: https://docs.liftoff.io/advertiser/direct/liftoff-gdpr-opt-out-api
